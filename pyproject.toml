[project]
name = "flet-lucid"
version = "0.3.0"
description = "use 2000+ lucide icons with the flet framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "arief minardi", email = "ariefminardi005@gmail.com" }
]
dependencies = [
    "flet>=1.1.2",
]

[project.urls]
Repository = "https://github.com/arief05652/flet-lucid"

[tool.setuptools.package-data]
"flutter.flet_lucid" = ["**/*"]

[tool.setuptools]
license-files = ["LICENSE"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
